services:
  - type: web
    name: owwa4a-inventory
    runtime: docker
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /up
    # Free tier does not support persistent disks. Templates are copied from
    # resources/owwa-templates into storage/app/templates on image build + boot.
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://owwa-inventory.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_PORT
        value: "5432"
      - key: DB_SSLMODE
        value: require
      # Do not reseed on every wake/restart (causes long boots + mid-demo 503 recovery).
      # First empty DB only: set SEED_ON_BOOT=true once, optionally with SEED_DEMO=true.
      - key: SEED_ON_BOOT
        value: "false"
      - key: SEED_DEMO
        value: "false"
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: BROADCAST_CONNECTION
        value: pusher
      # Set Pusher Channels keys in the Render Dashboard (do not commit secrets).
      - key: PUSHER_APP_ID
        sync: false
      - key: PUSHER_APP_KEY
        sync: false
      - key: PUSHER_APP_SECRET
        sync: false
      - key: PUSHER_APP_CLUSTER
        sync: false
      - key: PUSHER_SCHEME
        value: https
      - key: PUSHER_PORT
        value: "443"
      - key: VITE_PUSHER_APP_KEY
        sync: false
      - key: VITE_PUSHER_APP_CLUSTER
        sync: false
      - key: OLLAMA_URL
        value: http://127.0.0.1:11434
      - key: OLLAMA_EMBED_MODEL
        value: nomic-embed-text
      - key: OLLAMA_CHAT_MODEL
        value: deepseek-r1:7b
      - key: OWWA_TEMPLATES_STRICT
        value: "true"
      # Set a strong random value in the Render dashboard (not committed).
      - key: RAG_CONTEXT_TOKEN
        sync: false
      - key: ALLOW_PRODUCTION_SEED
        value: "false"
      - key: LIBREOFFICE_PDF
        value: "true"
      - key: LIBREOFFICE_BINARY
        value: soffice
      - key: LIBREOFFICE_TIMEOUT
        value: "90"
